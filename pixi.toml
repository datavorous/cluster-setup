[workspace]
name = "research"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pytorch = "2.11.*"
pytorch-cuda = "12.4.*"

[pypi-dependencies]
transformers = ">=4.51"
accelerate = ">=1.6"

[activation.env]
HF_HOME = "${SCRATCH}/hf_cache"
HF_HUB_CACHE = "${SCRATCH}/hf_cache/hub"